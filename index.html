<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tiny island adventure played with red-green glasses." />
    <title>Red-Green Open World</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #fff;
              font: 700 28px system-ui, sans-serif; background: #0b1020; transition: opacity .4s; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui-root"></div>
    <div id="boot">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
